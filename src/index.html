<!-- # Календар

Відобразити календар посередині екрана (як горизонтально, так і вертикально). Використовуйте SCSS та дотримуйтесь BEM. Не використовуйте Javascript.

- Пишіть стилі в `src/styles/main.scss` замість `src/style.css`.
- Створіть розмітку для блоку календаря з 31 днем всередині
  - НЕ додавайте числа в HTML (ви зробите це за допомогою CSS)
- Кожен день - це сірий (`#eee`) `100px` квадрат (включаючи чорну рамку 1px)
  - Додайте число (`Arial 30px`) в центрі кожного дня, використовуючи `::before` та [@for](https://sass-lang.com/documentation/at-rules/control/for)
- Використовуйте flex з відступом `1px` і обмежте його ширину рівно до 7 колонок + відступи `10px`.
  - Не використовуйте жорстко закодовані значення `px`, якщо вони використовуються кілька разів
  - Використовуйте правильно названі змінні, щоб зробити всі обчислення більш зрозумілими.
- Реалізуйте модифікатор `start-day` для `calendar` зі значеннями `mon`, `tue`, `wed`, `thu`, `fri`, `sat` та `sun`
  - Використовуйте [@each](https://sass-lang.com/documentation/at-rules/control/each) для створення всіх модифікаторів
  - Місяць повинен починатися з правильного стовпчика (понеділок - 1-й, п'ятниця - 5-й)
  - Ви можете просто додати правильний `margin-left` для першого дня
  - Встановіть в HTML за замовчуванням відлік календаря з неділі
- Додайте модифікатор `month-length` для `calendar` зі значеннями 28, 29, 30 і 31 (використовуйте `@for`)
  - Встановлює останній день для показу (використовуйте [nth-child](https://css-tricks.com/how-nth-child-works/))
  - Встановіть 31 день за замовчуванням у вашому HTML

При наведенні курсору на комірку
